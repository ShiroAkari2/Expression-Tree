<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make 24!!</title>
<style>
:root{--bg:#f2efe6;--ink:#1d2433;--panel:#fffdf6;--edge:#cfc8b4;--btn:#dcdcdc;--btn-edge:#b4b4b4;--btn-ink:#1d2433;--ok:#2e7d4f;--bad:#b3392f;--mut:#6b7080;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b26;--ink:#ece8dc;--panel:#232a3a;--edge:#39425a;--ok:#5fc087;--bad:#ee7b70;--mut:#98a0b5;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;justify-content:center}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{width:100%;max-width:560px;height:100%;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:clamp(6px,1.2dvh,12px)}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.35rem;margin:0;line-height:1.2}
.brand small{display:block;font-size:.72rem;color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stat{color:var(--mut);font-size:.85rem;text-align:right}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.5dvh,14px)}
.target{text-align:center;color:var(--mut);font-size:.9rem}
.target b{display:block;font-size:clamp(2.6rem,9dvh,4.2rem);line-height:1.05;color:var(--ink)}
.screen{background:var(--panel);border:2px solid var(--edge);border-radius:14px;min-height:clamp(52px,9dvh,88px);padding:8px 14px;font-size:clamp(1.3rem,3.6dvh,1.9rem);letter-spacing:.08em;word-break:break-all;display:flex;align-items:center;justify-content:center;text-align:center}
.screen.empty{color:var(--mut);font-size:1rem;letter-spacing:0}
#msg{min-height:2.6em;text-align:center;font-weight:bold;font-size:.9rem;line-height:1.3;display:flex;align-items:center;justify-content:center}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.histbox{height:clamp(52px,9dvh,80px);overflow-y:auto;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px 8px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px 6px;font-size:.78rem}
.histbox .hl{flex-basis:100%;color:var(--mut)}
.chip{padding:1px 8px;border:1px solid var(--edge);border-radius:999px;white-space:nowrap}
.chip.ok{border-color:var(--ok)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ops{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr 1.6fr;gap:8px}
button{font:inherit;font-weight:bold;border:0;border-radius:14px;background:var(--btn);color:var(--btn-ink);box-shadow:0 3px 0 var(--btn-edge);cursor:pointer;padding:0 4px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--btn-edge)}
button:disabled{opacity:.35;cursor:default;box-shadow:none}
.nums button{height:clamp(50px,10dvh,80px);font-size:clamp(1.6rem,4.6dvh,2.2rem)}
.ops button{height:clamp(44px,8dvh,64px);font-size:clamp(1.3rem,3.6dvh,1.7rem)}
.acts button{height:clamp(44px,7.5dvh,60px);font-size:.9rem}
.acts .go{border:2px solid var(--ink)}
#hint{height:38px;padding:0 18px;font-size:.95rem}
.mode{display:flex;gap:8px}
.mode button{height:32px;padding:0 12px;font-size:.85rem;box-shadow:none}
.mode button[aria-pressed="true"]{border:2px solid var(--ink)}
</style>
</head>
<body>
<main>
  <header><div class="brand"><h1>Make 24!!</h1><small>By ShiroAkari</small></div><button id="hint">Hint</button></header>
  <div class="bar">
    <div class="mode">
      <button id="m-classic" aria-pressed="true">Klasik 24</button>
      <button id="m-random" aria-pressed="false">Acak</button>
    </div>
    <span class="stat" id="stat"></span>
  </div>
  <div class="stage">
    <div class="target">Buat angka<b id="target">24</b></div>
    <div class="screen empty" id="screen"></div>
    <div id="msg" aria-live="polite"></div>
    <div class="histbox" id="hist"></div>
    <div class="nums" id="nums"></div>
    <div class="ops" id="ops"></div>
    <div class="acts">
      <button id="skip">Soal lain</button>
      <button id="undo">Hapus</button>
      <button id="clear">Ulang</button>
      <button id="check" class="go">Cek jawaban</button>
    </div>
  </div>
</main>
<script>
const OPS = ['+','-','*','/'];
const SHOW = {'+':'+','-':'\u2212','*':'\u00d7','/':'\u00f7','(':'(',')':')'};

// Pecahan eksak (pembilang/penyebut) supaya hasil tengah boleh pecahan
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const fr=(n,d=1)=>{ if(d<0){n=-n;d=-d;} const g=gcd(n,d)||1; return {n:n/g,d:d/g}; };
const add=(a,b)=>fr(a.n*b.d+b.n*a.d,a.d*b.d);
const sub=(a,b)=>fr(a.n*b.d-b.n*a.d,a.d*b.d);
const mul=(a,b)=>fr(a.n*b.n,a.d*b.d);
const div=(a,b)=>b.n===0?null:fr(a.n*b.d,a.d*b.n);
const fmt=v=>v.d===1?String(v.n):v.n+'/'+v.d;

function apply(op,a,b,intOnly){
  const r = op==='+'?add(a,b) : op==='-'?sub(a,b) : op==='*'?mul(a,b) : div(a,b);
  if(r===null || (intOnly && r.d!==1)) return null;
  return r;
}
const items = n => n.map(x=>({v:fr(x),s:String(x)}));

// Cari satu solusi; simpan langkah pertama untuk hint
function solve(list,target,top,intOnly){
  if(list.length===1) return (list[0].v.d===1&&list[0].v.n===target) ? {s:list[0].s} : null;
  for(let i=0;i<list.length;i++) for(let j=0;j<list.length;j++){
    if(i===j) continue;
    const a=list[i], b=list[j];
    const rest=list.filter((_,k)=>k!==i&&k!==j);
    for(const op of OPS){
      if((op==='+'||op==='*')&&i>j) continue;
      const v=apply(op,a.v,b.v,intOnly);
      if(v===null) continue;
      const r=solve([...rest,{v,s:'('+a.s+op+b.s+')'}],target,false,intOnly);
      if(r){ if(top) r.step=[a.s,op,b.s]; return r; }
    }
  }
  return null;
}
// Utamakan solusi tanpa pecahan, baru pecahan
const findSolution=(n,t)=>solve(items(n),t,true,true)||solve(items(n),t,true,false);

// Kumpulkan semua nilai bulat yang bisa dicapai
function reach(arr,out){
  if(arr.length===1){ if(arr[0].d===1) out.add(arr[0].n); return; }
  for(let i=0;i<arr.length;i++) for(let j=0;j<arr.length;j++){
    if(i===j) continue;
    const rest=arr.filter((_,k)=>k!==i&&k!==j);
    for(const op of OPS){
      if((op==='+'||op==='*')&&i>j) continue;
      const v=apply(op,arr[i],arr[j],false);
      if(v!==null) reach([...rest,v],out);
    }
  }
}
const pretty = s => (s[0]==='('?s.slice(1,-1):s).replace(/[*\/\-]/g,c=>SHOW[c]);

// Pengecek jawaban: kurung dan perkalian tersirat, mis. (4+2-3)6 atau 2(3+1)
function evaluate(tokens){
  let p=0, lastParen=false;
  const fail=m=>{throw new Error(m)};
  const isNum=t=>t!==undefined&&/^\d+$/.test(t);
  function expr(){
    let v=term();
    while(tokens[p]==='+'||tokens[p]==='-'){
      const o=tokens[p++], t=term();
      v=o==='+'?add(v,t):sub(v,t);
    }
    return v;
  }
  function term(){
    let v=factor(), paren=lastParen;
    for(;;){
      const t=tokens[p];
      if(t==='*'||t==='/'){
        p++; const f=factor(); paren=lastParen;
        if(t==='*') v=mul(v,f);
        else { if(f.n===0) fail('Tidak bisa dibagi nol'); v=div(v,f); }
      } else if(t==='('||(paren&&isNum(t))){
        const f=factor(); paren=lastParen; v=mul(v,f);
      } else break;
    }
    return v;
  }
  function factor(){
    const t=tokens[p];
    if(t===undefined) fail('Susunan belum lengkap');
    if(t==='('){
      p++; const v=expr();
      if(tokens[p++]!==')') fail('Kurung belum tertutup');
      lastParen=true; return v;
    }
    if(isNum(t)){ p++; lastParen=false; return fr(Number(t)); }
    fail('Susunan tidak valid');
  }
  const v=expr();
  if(p<tokens.length) fail('Susunan tidak valid');
  return v;
}

let mode='classic', nums=[], target=24, sol=null, seq=[], tried=[], score=0, streak=0, locked=false, hintLevel=0;
const $=id=>document.getElementById(id);

function newPuzzle(){
  let n,t;
  for(;;){
    n=Array.from({length:4},()=>1+Math.floor(Math.random()*9));
    if(mode==='classic'){
      t=24;
      if(findSolution(n,t)) break;
    } else {
      const set=new Set(); reach(n.map(x=>fr(x)),set);
      const sum=n.reduce((x,y)=>x+y,0);
      const pool=[...set].filter(v=>v>=6&&v<=50&&v!==sum);
      if(pool.length){ t=pool[Math.floor(Math.random()*pool.length)]; break; }
    }
  }
  nums=n; target=t; sol=findSolution(n,t);
  seq=[]; tried=[]; locked=false; hintLevel=0; setMsg('');
  const box=$('nums'); box.innerHTML='';
  nums.forEach((x,i)=>{
    const b=document.createElement('button'); b.textContent=x; b.dataset.i=i;
    b.onclick=()=>push(String(x),i); box.appendChild(b);
  });
  const ob=$('ops'); ob.innerHTML='';
  ['+','-','*','/','(',')'].forEach(o=>{
    const b=document.createElement('button'); b.textContent=SHOW[o];
    b.onclick=()=>push(o); ob.appendChild(b);
  });
  render();
}
function push(t,i){ if(locked) return; seq.push({t,i}); setMsg(''); render(); }
const seqText=()=>seq.map(x=>SHOW[x.t]||x.t).join(' ');
function render(){
  const s=$('screen');
  if(!seq.length){ s.className='screen empty'; s.textContent='Tekan tombol untuk menyusun'; }
  else { s.className='screen'; s.textContent=seqText(); }
  const used=new Set(seq.filter(x=>x.i!==undefined).map(x=>x.i));
  document.querySelectorAll('#nums button').forEach(b=>b.disabled=used.has(Number(b.dataset.i)));
  $('target').textContent=target;
  $('stat').textContent='Skor '+score+' \u00b7 Beruntun '+streak;
  $('m-classic').setAttribute('aria-pressed',mode==='classic');
  $('m-random').setAttribute('aria-pressed',mode==='random');
  renderHist();
}
function renderHist(){
  const h=$('hist'); h.innerHTML='';
  const l=document.createElement('div'); l.className='hl';
  l.textContent=tried.length?'Percobaan ('+tried.length+')':'Percobaan: belum ada';
  h.appendChild(l);
  tried.forEach(t=>{
    const d=document.createElement('div'); d.className='chip'+(t.ok?' ok':'');
    d.textContent=t.text+' = '+t.res+(t.ok?' \u2713':'');
    h.appendChild(d);
  });
}
function setMsg(t,c){ const m=$('msg'); m.textContent=t; m.className=c||''; }

$('m-classic').onclick=()=>{ mode='classic'; streak=0; newPuzzle(); };
$('m-random').onclick=()=>{ mode='random'; streak=0; newPuzzle(); };
$('undo').onclick=()=>{ if(locked) return; seq.pop(); setMsg(''); render(); };
$('clear').onclick=()=>{ if(locked) return; seq=[]; setMsg(''); render(); };
$('skip').onclick=()=>{ streak=0; newPuzzle(); };
$('hint').onclick=()=>{
  if(locked) return;
  hintLevel++;
  if(hintLevel===1){
    const [a,o,b]=sol.step;
    setMsg('Coba gabungkan '+a+' '+SHOW[o]+' '+b+' dulu. Tekan Hint lagi untuk lihat solusi.');
  } else {
    streak=0; locked=true; render();
    setMsg('Solusi: '+pretty(sol.s)+' = '+target+'. Tekan "Soal lain" untuk lanjut.');
  }
};
$('check').onclick=()=>{
  if(locked) return;
  const used=seq.filter(x=>x.i!==undefined).length;
  if(used<4){ setMsg('Pakai keempat angka dulu ('+used+'/4)','bad'); return; }
  try{
    const toks=seq.map(x=>x.t), key=toks.join(' ');
    const v=evaluate(toks);
    if(tried.some(h=>h.key===key)){ setMsg('Susunan ini sudah dicoba','bad'); return; }
    const ok=v.d===1&&v.n===target;
    tried.unshift({key,text:seqText(),res:fmt(v),ok});
    if(ok){
      score++; streak++; locked=true; render(); setMsg('Benar! Hasilnya '+target,'ok');
      setTimeout(newPuzzle,1600);
    } else { streak=0; render(); setMsg('Hasilnya '+fmt(v)+', belum '+target,'bad'); }
  }catch(e){ setMsg(e.message,'bad'); }
};
newPuzzle();
</script>
</body>
</html>
